apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-frontend
  namespace: ci-cd-dashboard
  labels:
    app: ci-cd-frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-cd-frontend
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ci-cd-frontend
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ci-cd-dashboard-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
