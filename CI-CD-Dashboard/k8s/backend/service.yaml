apiVersion: v1
kind: Service
metadata:
  name: ci-cd-backend
  namespace: ci-cd-dashboard
  labels:
    app: ci-cd-backend
    component: backend
spec:
  selector:
    app: ci-cd-backend
    component: backend
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
