apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The name of the Argo CD Application resource shown in the Argo CD UI.
  name: ci-cd-dashboard
  # Deploy this Application into the Argo CD control plane namespace.
  namespace: argocd
  # Standard labels for discoverability and ownership.
  labels:
    app.kubernetes.io/name: ci-cd-dashboard
    app.kubernetes.io/part-of: gitops
spec:
  # The project that defines AppSync and RBAC policies for this application.
  project: default
  # The source repository and path that Argo CD should reconcile.
  source:
    # The Git repository containing the Kubernetes manifests.
    repoURL: https://github.com/shadakhtar1/ci-cd-pipeline-health-dashboard.git
    # Use the current development branch for this assignment milestone.
    targetRevision: assignment-3
    # The directory inside the repository that contains the manifests to deploy.
    path: CI-CD-Dashboard/k8s
    # The directory where Argo CD should render the manifests before applying them.
    directory:
      recurse: true
  # The destination cluster and namespace where the manifests will be applied.
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-cd-dashboard
  # Sync policy controls how Argo CD applies changes automatically.
  syncPolicy:
    # Enable automated synchronization when the Git repository changes.
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    # Keep the application in sync with the repository even when no changes are detected.
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=false
    # Prevent Argo CD from failing if the target namespace does not exist yet.
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/managed-by: argocd
